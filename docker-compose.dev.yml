# Docker Compose for Development
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mini_erp_db_dev
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - erp_network_dev

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mini_erp_redis_dev
    ports:
      - "6379:6379"
    networks:
      - erp_network_dev

volumes:
  postgres_data_dev:

networks:
  erp_network_dev:
    driver: bridge
